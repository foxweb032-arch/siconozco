<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiConozco – Panel de administración</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Fraunces:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="siconozco.css">
</head>
<body>

<!-- LOGIN -->
<div class="admin-login-wrap" id="loginWrap">
  <div class="admin-login-box">
    <h2>Panel de administración</h2>
    <p class="sub">Acceso exclusivo para el equipo de SiConozco</p>
    <input type="email" id="loginEmail" placeholder="Correo electrónico">
    <input type="password" id="loginPassword" placeholder="Contraseña">
    <button class="admin-login-btn" onclick="hacerLogin()">Entrar</button>
    <p class="admin-login-error" id="loginError"></p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboardWrap" style="display:none;">

  <div class="admin-header">
    <h1>🔧 Panel de administración</h1>
    <button class="admin-logout-btn" onclick="hacerLogout()">Cerrar sesión</button>
  </div>

  <div class="admin-main-tabs">
    <button class="admin-main-tab activa" data-seccion="proveedores" onclick="cambiarSeccion('proveedores')">Proveedores</button>
    <button class="admin-main-tab" data-seccion="reservaciones" onclick="cambiarSeccion('reservaciones')">Reservaciones</button>
    <button class="admin-main-tab" data-seccion="mensajes" onclick="cambiarSeccion('mensajes')">Mensajes de contacto</button>
  </div>

  <div id="seccionProveedores">
    <div class="admin-tabs" id="adminTabs">
      <button class="admin-tab activa" data-estado="todos" onclick="cambiarFiltro('todos')">Todos</button>
      <button class="admin-tab" data-estado="pendiente" onclick="cambiarFiltro('pendiente')">Pendientes</button>
      <button class="admin-tab" data-estado="aprobado" onclick="cambiarFiltro('aprobado')">Aprobados</button>
      <button class="admin-tab" data-estado="rechazado" onclick="cambiarFiltro('rechazado')">Rechazados</button>
    </div>

    <div class="admin-grid" id="adminGrid">
      <p style="grid-column:1/-1; text-align:center; color:var(--mid-gray); padding:30px;">Cargando proveedores…</p>
    </div>
  </div>

  <div id="seccionReservaciones" style="display:none;">
    <div class="admin-tabs" id="reservaTabs">
      <button class="admin-tab activa" data-estado="todas" onclick="cambiarFiltroReserva('todas')">Todas</button>
      <button class="admin-tab" data-estado="pendiente" onclick="cambiarFiltroReserva('pendiente')">Pendientes</button>
      <button class="admin-tab" data-estado="confirmada" onclick="cambiarFiltroReserva('confirmada')">Confirmadas</button>
      <button class="admin-tab" data-estado="completado" onclick="cambiarFiltroReserva('completado')">Completadas</button>
      <button class="admin-tab" data-estado="cancelada" onclick="cambiarFiltroReserva('cancelada')">Canceladas</button>
    </div>
    <div class="admin-list" id="reservacionesList">
      <p style="text-align:center; color:var(--mid-gray); padding:30px;">Cargando reservaciones…</p>
    </div>
  </div>

  <div id="seccionMensajes" style="display:none;">
    <div class="admin-list" id="mensajesList">
      <p style="text-align:center; color:var(--mid-gray); padding:30px;">Cargando mensajes…</p>
    </div>
  </div>
</div>

<!-- MODAL DE GESTIÓN -->
<div class="modal-overlay" id="editOverlay" onclick="cerrarEdicionSiFondo(event)">
  <div class="modal-box admin-edit-box">
    <div class="modal-body">
      <div class="modal-header">
        <h2>Gestionar proveedor</h2>
        <button class="modal-close" onclick="cerrarEdicion()">✕</button>
      </div>

      <span class="admin-status-badge" id="editEstadoBadge"></span>

      <div class="admin-status-row">
        <button class="admin-btn-aprobar" onclick="cambiarEstado('aprobado')">✓ Aprobar</button>
        <button class="admin-btn-rechazar" onclick="cambiarEstado('rechazado')">✕ Rechazar</button>
        <button class="admin-btn-pendiente" onclick="cambiarEstado('pendiente')">⏳ Pendiente</button>
      </div>

      <p class="perfil-reviews-title">Fotos</p>
      <div class="admin-photos-grid" id="editPhotosGrid"></div>
      <label class="admin-add-photo-label" style="width:80px;">
        +
        <input type="file" id="editAddPhotoInput" accept="image/*" onchange="agregarFotoAdmin(event)">
      </label>

      <p class="perfil-reviews-title" id="editResenasTitle">Reseñas</p>
      <div class="admin-resenas-list" id="editResenasList">
        <p class="perfil-empty-reviews">Cargando reseñas…</p>
      </div>

      <p class="perfil-reviews-title">Datos del proveedor</p>
      <div class="admin-field">
        <label>Nombre</label>
        <input type="text" id="editNombre">
      </div>
      <div class="admin-field">
        <label>Teléfono</label>
        <input type="text" id="editTelefono">
      </div>
      <div class="admin-field">
        <label>Email</label>
        <input type="email" id="editEmail">
      </div>
      <div class="admin-field">
        <label>Categoría</label>
        <select id="editCategoria">
          <option value="carpintero">Carpintero</option>
          <option value="herrero">Herrero</option>
          <option value="albanil">Albañil</option>
          <option value="electricista">Electricista</option>
          <option value="plomero">Plomero</option>
          <option value="pintor">Pintor</option>
          <option value="vidriero">Vidriero</option>
          <option value="jardinero">Jardinero</option>
        </select>
      </div>
      <div class="admin-field">
        <label>Especialidad</label>
        <input type="text" id="editEspecialidad">
      </div>
      <div class="admin-field">
        <label>Ubicación</label>
        <input type="text" id="editUbicacion">
      </div>
      <div class="admin-field">
        <label>Años de experiencia</label>
        <input type="text" id="editExperiencia">
      </div>
      <div class="admin-field">
        <label>Descripción</label>
        <textarea id="editDescripcion" rows="3"></textarea>
      </div>

      <button class="admin-save-btn" id="btnGuardarCambios" onclick="guardarCambios()">Guardar cambios</button>
      <p class="admin-save-msg" id="saveMsg">✓ Cambios guardados</p>

      <button class="admin-delete-btn" onclick="confirmarEliminar()">Eliminar proveedor permanentemente</button>
    </div>
  </div>
</div>

<script type="module">
  import {
    onAuthChange, loginAdmin, logoutAdmin,
    cargarTodosLosProveedores, actualizarProveedor, eliminarProveedor,
    subirFotoAdmin, eliminarFotoStorage,
    cargarResenas, eliminarResena,
    cargarReservaciones, marcarReservacion, actualizarReservacion,
    cargarMensajes, marcarMensajeRespondido
  } from './firebase.js';

  let proveedoresCache = [];
  let filtroActual      = 'todos';
  let proveedorEnEdicion = null; // objeto completo del proveedor abierto
  let reservacionesCache = [];
  let mensajesCache      = [];
  let seccionActual      = 'proveedores';
  let reservaFiltro      = 'todas';

  // ── LOGIN / LOGOUT ─────────────────────
  onAuthChange((user) => {
    if (user) {
      document.getElementById('loginWrap').style.display = 'none';
      document.getElementById('dashboardWrap').style.display = 'block';
      cargarYRenderizar();
    } else {
      document.getElementById('loginWrap').style.display = 'flex';
      document.getElementById('dashboardWrap').style.display = 'none';
    }
  });

  async function hacerLogin() {
    const email    = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errorEl  = document.getElementById('loginError');
    errorEl.style.display = 'none';

    try {
      await loginAdmin(email, password);
    } catch (error) {
      console.error('Error de login:', error);
      errorEl.textContent = 'Correo o contraseña incorrectos.';
      errorEl.style.display = 'block';
    }
  }

  async function hacerLogout() {
    await logoutAdmin();
  }

  // ── CARGAR Y RENDERIZAR TARJETAS ───────
  async function cargarYRenderizar() {
    proveedoresCache = await cargarTodosLosProveedores();
    renderGrid();
  }

  function cambiarFiltro(estado) {
    filtroActual = estado;
    document.querySelectorAll('.admin-tab').forEach(t => {
      t.classList.toggle('activa', t.dataset.estado === estado);
    });
    renderGrid();
  }

  const EMOJIS_CAT = {
    carpintero: '🪚', herrero: '⚒️', albanil: '🧱',
    electricista: '⚡', plomero: '🔧', pintor: '🎨',
    vidriero: '🪟', jardinero: '🍃'
  };

  function renderGrid() {
    const grid = document.getElementById('adminGrid');
    const lista = filtroActual === 'todos'
      ? proveedoresCache
      : proveedoresCache.filter(p => p.estado === filtroActual);

    if (lista.length === 0) {
      grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:var(--mid-gray); padding:30px;">No hay proveedores en esta categoría.</p>';
      return;
    }

    grid.innerHTML = '';
    lista.forEach(p => {
      const foto = (p.fotos && p.fotos.length > 0) ? p.fotos[0] : '';
      const emoji = EMOJIS_CAT[p.categoria] || '🔧';
      const thumbHtml = foto
        ? `<img class="admin-card-thumb" src="${foto}" alt="${p.nombre}">`
        : `<div class="admin-card-thumb-placeholder">${emoji}</div>`;

      const card = document.createElement('div');
      card.className = 'admin-card';
      card.innerHTML = `
        ${thumbHtml}
        <div class="admin-card-body">
          <span class="admin-status-badge admin-status-${p.estado || 'pendiente'}">${p.estado || 'pendiente'}</span>
          <h3>${p.nombre}</h3>
          <p>${p.especialidad || ''}</p>
          <button class="admin-manage-btn">Gestionar</button>
        </div>`;
      card.querySelector('.admin-manage-btn').addEventListener('click', () => abrirEdicion(p.id));
      grid.appendChild(card);
    });
  }

  // ── CAMBIO DE SECCIÓN PRINCIPAL ─────────
  function cambiarSeccion(seccion) {
    seccionActual = seccion;
    document.querySelectorAll('.admin-main-tab').forEach(t => {
      t.classList.toggle('activa', t.dataset.seccion === seccion);
    });
    document.getElementById('seccionProveedores').style.display    = seccion === 'proveedores'    ? 'block' : 'none';
    document.getElementById('seccionReservaciones').style.display  = seccion === 'reservaciones'  ? 'block' : 'none';
    document.getElementById('seccionMensajes').style.display       = seccion === 'mensajes'        ? 'block' : 'none';

    if (seccion === 'reservaciones' && reservacionesCache.length === 0) cargarYRenderizarReservaciones();
    if (seccion === 'mensajes'      && mensajesCache.length === 0)      cargarYRenderizarMensajes();
  }

  function formatearFecha(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  function soloDigitos(str) {
    return (str || '').replace(/\D/g, '');
  }

  // ── RESERVACIONES ────────────────────────
  async function cargarYRenderizarReservaciones() {
    reservacionesCache = await cargarReservaciones();
    renderReservaciones();
  }

  function cambiarFiltroReserva(estado) {
    reservaFiltro = estado;
    document.querySelectorAll('#reservaTabs .admin-tab').forEach(t => {
      t.classList.toggle('activa', t.dataset.estado === estado);
    });
    renderReservaciones();
  }

  function renderReservaciones() {
    const cont = document.getElementById('reservacionesList');
    const lista = reservaFiltro === 'todas'
      ? reservacionesCache
      : reservacionesCache.filter(r => (r.estado || 'pendiente') === reservaFiltro);

    if (lista.length === 0) {
      cont.innerHTML = '<p style="text-align:center; color:var(--mid-gray); padding:30px;">No hay reservaciones en esta categoría.</p>';
      return;
    }

    cont.innerHTML = lista.map(r => `
      <div class="admin-list-item">
        <div class="admin-list-top">
          <span class="admin-list-title">${r.clienteNombre || 'Sin nombre'} → ${r.proveedorNombre || ''}</span>
          <span class="admin-list-date">${formatearFecha(r.fechaCreacion)}</span>
        </div>
        <div class="admin-list-body">
          <strong>Teléfono:</strong> ${r.clienteTelefono || '—'}<br>
          <strong>Dirección:</strong> ${r.direccion || '—'}<br>
          <strong>Horario solicitado:</strong> ${r.fechaHora || '—'}<br>
          <strong>Categoría:</strong> ${r.categoria || '—'}<br>
          <strong>Descripción:</strong> ${r.descripcion || '—'}<br>
          <strong>Canal:</strong> ${r.canal === 'whatsapp' ? 'WhatsApp' : 'Email'} ·
          <strong>Estado:</strong> <span class="admin-status-badge admin-status-${r.estado === 'confirmada' ? 'aprobado' : (r.estado === 'cancelada' ? 'rechazado' : (r.estado === 'completado' ? 'completado' : 'pendiente'))}">${r.estado || 'pendiente'}</span>
        </div>
        <div class="admin-list-actions">
          ${r.clienteTelefono ? `<a class="admin-btn-whatsapp-link" href="https://wa.me/52${soloDigitos(r.clienteTelefono)}" target="_blank">WhatsApp</a>` : ''}
          <button class="admin-btn-mark ${r.estado === 'confirmada' ? 'activo' : ''}" data-id="${r.id}" data-estado="confirmada">Confirmar</button>
          <button class="admin-btn-mark ${r.estado === 'completado' ? 'activo' : ''}" data-id="${r.id}" data-estado="completado">✓ Completado</button>
          <button class="admin-btn-mark ${r.estado === 'cancelada' ? 'activo' : ''}" data-id="${r.id}" data-estado="cancelada">Cancelar</button>
        </div>
        <div class="admin-notas-wrap">
          <label>Notas internas (ej. "el proveedor debe regresar", quejas, etc.)</label>
          <textarea rows="2" data-nota-id="${r.id}" placeholder="Escribe una nota sobre este servicio...">${r.comentarioAdmin || ''}</textarea>
          <button class="admin-btn-guardar-nota" data-nota-id="${r.id}">Guardar nota</button>
          <p class="admin-nota-guardada" data-nota-msg="${r.id}">✓ Nota guardada</p>
        </div>
      </div>
    `).join('');

    cont.querySelectorAll('.admin-btn-mark').forEach(btn => {
      btn.addEventListener('click', () => actualizarEstadoReservacion(btn.dataset.id, btn.dataset.estado));
    });
    cont.querySelectorAll('.admin-btn-guardar-nota').forEach(btn => {
      btn.addEventListener('click', () => guardarNotaReservacion(btn.dataset.notaId));
    });
  }

  async function guardarNotaReservacion(id) {
    const textarea = document.querySelector(`textarea[data-nota-id="${id}"]`);
    const nota = textarea.value.trim();
    try {
      await actualizarReservacion(id, { comentarioAdmin: nota });
      const r = reservacionesCache.find(x => x.id === id);
      if (r) r.comentarioAdmin = nota;

      const msg = document.querySelector(`[data-nota-msg="${id}"]`);
      msg.style.display = 'block';
      setTimeout(() => { msg.style.display = 'none'; }, 2000);
    } catch (error) {
      console.error('Error al guardar la nota:', error);
      alert('Hubo un error al guardar la nota.');
    }
  }

  async function actualizarEstadoReservacion(id, estado) {
    try {
      await marcarReservacion(id, estado);
      const r = reservacionesCache.find(x => x.id === id);
      if (r) r.estado = estado;
      renderReservaciones();
    } catch (error) {
      console.error('Error al actualizar reservación:', error);
      alert('Hubo un error al actualizar la reservación.');
    }
  }

  // ── MENSAJES DE CONTACTO ─────────────────
  async function cargarYRenderizarMensajes() {
    mensajesCache = await cargarMensajes();
    renderMensajes();
  }

  function renderMensajes() {
    const cont = document.getElementById('mensajesList');
    if (mensajesCache.length === 0) {
      cont.innerHTML = '<p style="text-align:center; color:var(--mid-gray); padding:30px;">Aún no hay mensajes de contacto.</p>';
      return;
    }

    cont.innerHTML = mensajesCache.map(m => `
      <div class="admin-list-item" style="${m.respondido ? 'opacity:.6;' : ''}">
        <div class="admin-list-top">
          <span class="admin-list-title">${m.nombre || 'Sin nombre'} — ${m.asunto || 'Sin asunto'}</span>
          <span class="admin-list-date">${formatearFecha(m.fechaCreacion)}</span>
        </div>
        <div class="admin-list-body">
          <strong>Email:</strong> ${m.email || '—'}<br>
          ${m.telefono ? `<strong>Teléfono:</strong> ${m.telefono}<br>` : ''}
          <strong>Mensaje:</strong> ${m.mensaje || '—'}
        </div>
        <div class="admin-list-actions">
          ${m.email ? `<a class="admin-btn-email-link" href="mailto:${m.email}?subject=Re: ${encodeURIComponent(m.asunto || 'tu mensaje')}">Responder por email</a>` : ''}
          ${m.telefono ? `<a class="admin-btn-whatsapp-link" href="https://wa.me/52${soloDigitos(m.telefono)}" target="_blank">WhatsApp</a>` : ''}
          <button class="admin-btn-mark ${m.respondido ? 'activo' : ''}" data-id="${m.id}">
            ${m.respondido ? '✓ Respondido' : 'Marcar como respondido'}
          </button>
        </div>
      </div>
    `).join('');

    cont.querySelectorAll('.admin-btn-mark').forEach(btn => {
      btn.addEventListener('click', () => toggleRespondido(btn.dataset.id));
    });
  }

  async function toggleRespondido(id) {
    const m = mensajesCache.find(x => x.id === id);
    if (!m) return;
    try {
      await marcarMensajeRespondido(id, !m.respondido);
      m.respondido = !m.respondido;
      renderMensajes();
    } catch (error) {
      console.error('Error al actualizar mensaje:', error);
      alert('Hubo un error al actualizar el mensaje.');
    }
  }

  // ── MODAL DE EDICIÓN ───────────────────
  function abrirEdicion(id) {
    const p = proveedoresCache.find(x => x.id === id);
    if (!p) return;
    proveedorEnEdicion = p;

    document.getElementById('editEstadoBadge').textContent = p.estado || 'pendiente';
    document.getElementById('editEstadoBadge').className   = `admin-status-badge admin-status-${p.estado || 'pendiente'}`;

    document.getElementById('editNombre').value       = p.nombre || '';
    document.getElementById('editTelefono').value     = p.telefono || '';
    document.getElementById('editEmail').value        = p.email || '';
    document.getElementById('editCategoria').value    = p.categoria || 'electricista';
    document.getElementById('editEspecialidad').value = p.especialidad || '';
    document.getElementById('editUbicacion').value    = p.ubicacion || '';
    document.getElementById('editExperiencia').value  = p.experiencia || '';
    document.getElementById('editDescripcion').value  = p.descripcion || '';

    document.getElementById('saveMsg').style.display = 'none';
    renderFotosEdicion();
    cargarYRenderResenasEdicion(p.id);

    document.getElementById('editOverlay').classList.add('activo');
  }

  function cerrarEdicion() {
    document.getElementById('editOverlay').classList.remove('activo');
    proveedorEnEdicion = null;
  }
  function cerrarEdicionSiFondo(e) {
    if (e.target.id === 'editOverlay') cerrarEdicion();
  }

  function renderFotosEdicion() {
    const grid  = document.getElementById('editPhotosGrid');
    const fotos = proveedorEnEdicion.fotos || [];
    grid.innerHTML = fotos.map((url, i) => `
      <div class="admin-photo-item">
        <img src="${url}" alt="foto ${i + 1}">
        <button class="admin-photo-remove" data-index="${i}">✕</button>
      </div>
    `).join('');
    grid.querySelectorAll('.admin-photo-remove').forEach(btn => {
      btn.addEventListener('click', () => eliminarFotoAdmin(parseInt(btn.dataset.index)));
    });
  }

  async function agregarFotoAdmin(e) {
    const archivo = e.target.files[0];
    if (!archivo) return;
    e.target.disabled = true;

    try {
      const url = await subirFotoAdmin(archivo);
      const fotosNuevas = [...(proveedorEnEdicion.fotos || []), url];
      await actualizarProveedor(proveedorEnEdicion.id, { fotos: fotosNuevas });
      proveedorEnEdicion.fotos = fotosNuevas;
      renderFotosEdicion();
    } catch (error) {
      console.error('Error al subir foto:', error);
      alert('Hubo un error al subir la foto.');
    } finally {
      e.target.disabled = false;
      e.target.value = '';
    }
  }

  async function eliminarFotoAdmin(index) {
    if (!confirm('¿Quitar esta foto?')) return;
    const fotos = [...(proveedorEnEdicion.fotos || [])];
    const [urlEliminada] = fotos.splice(index, 1);

    try {
      await actualizarProveedor(proveedorEnEdicion.id, { fotos });
      await eliminarFotoStorage(urlEliminada);
      proveedorEnEdicion.fotos = fotos;
      renderFotosEdicion();
    } catch (error) {
      console.error('Error al eliminar foto:', error);
      alert('Hubo un error al eliminar la foto.');
    }
  }

  // ── RESEÑAS (dentro del modal de gestión) ──
  function formatearFechaResena(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  async function cargarYRenderResenasEdicion(proveedorId) {
    const cont = document.getElementById('editResenasList');
    const titulo = document.getElementById('editResenasTitle');
    cont.innerHTML = '<p class="perfil-empty-reviews">Cargando reseñas…</p>';

    const resenas = await cargarResenas(proveedorId);
    // Evita pisar la vista si el admin ya cambió de proveedor mientras cargaba
    if (!proveedorEnEdicion || proveedorEnEdicion.id !== proveedorId) return;

    titulo.textContent = `Reseñas (${resenas.length})`;

    if (resenas.length === 0) {
      cont.innerHTML = '<p class="perfil-empty-reviews">Este proveedor aún no tiene reseñas.</p>';
      return;
    }

    cont.innerHTML = resenas.map(r => `
      <div class="admin-resena-item">
        <div class="admin-resena-top">
          <div class="admin-resena-info">
            <div class="review-header">
              <span class="review-author">${r.clienteNombre || 'Cliente anónimo'}</span>
              <span class="review-stars">${'★'.repeat(r.calificacion)}${'☆'.repeat(5 - r.calificacion)}</span>
            </div>
            <p class="review-comment">${r.comentario || ''}</p>
            <span class="admin-resena-fecha">${formatearFechaResena(r.fecha)}</span>
          </div>
          <button class="admin-resena-delete" data-id="${r.id}">Eliminar</button>
        </div>
      </div>
    `).join('');

    cont.querySelectorAll('.admin-resena-delete').forEach(btn => {
      btn.addEventListener('click', () => confirmarEliminarResena(btn.dataset.id, proveedorId));
    });
  }

  async function confirmarEliminarResena(resenaId, proveedorId) {
    if (!confirm('¿Eliminar esta reseña permanentemente? El promedio del proveedor se recalculará.')) return;

    try {
      await eliminarResena(proveedorId, resenaId);

      // Refrescar rating/totalResenas locales (la transacción ya los recalculó en Firestore)
      const proveedorActualizado = await cargarTodosLosProveedores();
      const actualizado = proveedorActualizado.find(x => x.id === proveedorId);
      if (actualizado) {
        proveedoresCache = proveedorActualizado;
        if (proveedorEnEdicion && proveedorEnEdicion.id === proveedorId) {
          proveedorEnEdicion.rating       = actualizado.rating;
          proveedorEnEdicion.totalResenas = actualizado.totalResenas;
        }
      }

      cargarYRenderResenasEdicion(proveedorId);
    } catch (error) {
      console.error('Error al eliminar reseña:', error);
      alert('Hubo un error al eliminar la reseña.');
    }
  }

  // ── CAMBIAR ESTADO ─────────────────────
  async function cambiarEstado(nuevoEstado) {
    try {
      await actualizarProveedor(proveedorEnEdicion.id, { estado: nuevoEstado });
      proveedorEnEdicion.estado = nuevoEstado;
      document.getElementById('editEstadoBadge').textContent = nuevoEstado;
      document.getElementById('editEstadoBadge').className   = `admin-status-badge admin-status-${nuevoEstado}`;

      // Actualizar caché y refrescar la cuadrícula de fondo
      const idx = proveedoresCache.findIndex(x => x.id === proveedorEnEdicion.id);
      if (idx !== -1) proveedoresCache[idx].estado = nuevoEstado;
      renderGrid();
    } catch (error) {
      console.error('Error al cambiar estado:', error);
      alert('Hubo un error al cambiar el estado.');
    }
  }

  // ── GUARDAR CAMBIOS DE TEXTO ────────────
  async function guardarCambios() {
    const datos = {
      nombre:       document.getElementById('editNombre').value.trim(),
      telefono:     document.getElementById('editTelefono').value.trim(),
      email:        document.getElementById('editEmail').value.trim(),
      categoria:    document.getElementById('editCategoria').value,
      especialidad: document.getElementById('editEspecialidad').value.trim(),
      ubicacion:    document.getElementById('editUbicacion').value.trim(),
      experiencia:  document.getElementById('editExperiencia').value.trim(),
      descripcion:  document.getElementById('editDescripcion').value.trim()
    };

    const btn = document.getElementById('btnGuardarCambios');
    btn.disabled = true;
    btn.textContent = 'Guardando...';

    try {
      await actualizarProveedor(proveedorEnEdicion.id, datos);
      Object.assign(proveedorEnEdicion, datos);

      const idx = proveedoresCache.findIndex(x => x.id === proveedorEnEdicion.id);
      if (idx !== -1) Object.assign(proveedoresCache[idx], datos);
      renderGrid();

      document.getElementById('saveMsg').style.display = 'block';
      setTimeout(() => { document.getElementById('saveMsg').style.display = 'none'; }, 2500);
    } catch (error) {
      console.error('Error al guardar cambios:', error);
      alert('Hubo un error al guardar los cambios.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Guardar cambios';
    }
  }

  // ── ELIMINAR PROVEEDOR ──────────────────
  async function confirmarEliminar() {
    if (!confirm(`¿Eliminar a "${proveedorEnEdicion.nombre}" permanentemente? Esta acción no se puede deshacer.`)) return;

    try {
      // Borrar todas sus fotos de Storage
      const fotos = proveedorEnEdicion.fotos || [];
      for (const url of fotos) {
        await eliminarFotoStorage(url);
      }
      await eliminarProveedor(proveedorEnEdicion.id);

      proveedoresCache = proveedoresCache.filter(x => x.id !== proveedorEnEdicion.id);
      cerrarEdicion();
      renderGrid();
    } catch (error) {
      console.error('Error al eliminar proveedor:', error);
      alert('Hubo un error al eliminar el proveedor.');
    }
  }

  window.hacerLogin          = hacerLogin;
  window.hacerLogout         = hacerLogout;
  window.cambiarSeccion      = cambiarSeccion;
  window.cambiarFiltroReserva = cambiarFiltroReserva;
  window.cambiarFiltro       = cambiarFiltro;
  window.cerrarEdicion       = cerrarEdicion;
  window.cerrarEdicionSiFondo = cerrarEdicionSiFondo;
  window.agregarFotoAdmin    = agregarFotoAdmin;
  window.cambiarEstado       = cambiarEstado;
  window.guardarCambios      = guardarCambios;
  window.confirmarEliminar   = confirmarEliminar;
</script>

</body>
</html>
